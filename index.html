<script>
(function(){
  const data = JSON.parse(document.getElementById('data-json').textContent);
  const root = document.getElementById('listRoot');
  const searchInput = document.getElementById('search');
  const clearBtn = document.getElementById('clearBtn');
  const hitCount = document.getElementById('hitCount');
  const emptyState = document.getElementById('emptyState');

  // ---- レンダリング ----
  data.forEach((house, hIdx) => {
    const section = document.createElement('section');
    section.className = 'house';
    section.dataset.house = hIdx;

    const heading = document.createElement('div');
    heading.className = 'house-heading';
    heading.innerHTML = `<h2>${escapeHtml(house.house)}</h2><span class="house-date">${escapeHtml(house.date || '')}</span>`;
    section.appendChild(heading);

    house.parties.forEach((party, pIdx) => {
      const block = document.createElement('div');
      block.className = 'party-block';
      block.dataset.party = pIdx;

      const pHeading = document.createElement('div');
      pHeading.className = 'party-heading';
      pHeading.innerHTML = `<h3 class="party-name">${escapeHtml(party.party)}</h3><span class="count">${party.members.length}名</span>`;
      block.appendChild(pHeading);

      if(party.source){
        const src = document.createElement('a');
        src.className = 'party-source';
        src.href = party.source;
        src.target = '_blank';
        src.rel = 'noopener noreferrer';
        src.textContent = 'データソース ↗';
        block.appendChild(src);
      }

      const table = document.createElement('table');
      table.innerHTML = `<thead><tr><th style="width:55%">氏名</th><th>ふりがな</th></tr></thead>`;
      const tbody = document.createElement('tbody');

      party.members.forEach(m => {
        const tr = document.createElement('tr');
        tr.dataset.name = m.name;
        tr.dataset.kana = m.kana;
        tr.dataset.party = party.party;
        const tdName = document.createElement('td');
        tdName.className = 'name';
        tdName.textContent = m.name;
        const tdKana = document.createElement('td');
        tdKana.className = 'kana';
        tdKana.textContent = m.kana;
        tr.appendChild(tdName);
        tr.appendChild(tdKana);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      block.appendChild(table);
      section.appendChild(block);
    });

    root.appendChild(section);
  });

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  function highlight(text, query){
    if(!query) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const q = escapeHtml(query);
    // 大文字小文字を無視した単純な部分一致ハイライト
    const idx = text.toLowerCase().indexOf(query.toLowerCase());
    if(idx === -1) return escaped;
    const before = escapeHtml(text.slice(0, idx));
    const match = escapeHtml(text.slice(idx, idx + query.length));
    const after = escapeHtml(text.slice(idx + query.length));
    return `${before}<mark class="hit">${match}</mark>${after}`;
  }

  function normalize(str){
    // 全角/半角スペース除去して比較しやすくする
    return str.replace(/[\s\u3000]/g, '').toLowerCase();
  }

  function runSearch(){
    const raw = searchInput.value.trim();
    clearBtn.style.display = raw ? 'block' : 'none';

    let visibleCount = 0;

    root.querySelectorAll('section.house').forEach(section => {
      let sectionHasVisible = false;

      section.querySelectorAll('.party-block').forEach(block => {
        let partyHasVisible = false;
        const partyName = block.querySelector('.party-name').textContent;

        block.querySelectorAll('tbody tr').forEach(tr => {
          const name = tr.dataset.name;
          const kana = tr.dataset.kana;
          const tdName = tr.querySelector('td.name');
          const tdKana = tr.querySelector('td.kana');

          if(!raw){
            tr.classList.remove('hidden');
            tdName.innerHTML = escapeHtml(name);
            tdKana.innerHTML = escapeHtml(kana);
            partyHasVisible = true;
            visibleCount++;
            return;
          }

          const q = normalize(raw);
          const matches =
            normalize(name).includes(q) ||
            normalize(kana).includes(q) ||
            normalize(partyName).includes(q);

          if(matches){
            tr.classList.remove('hidden');
            tdName.innerHTML = highlight(name, raw);
            tdKana.innerHTML = highlight(kana, raw);
            partyHasVisible = true;
            visibleCount++;
          } else {
            tr.classList.add('hidden');
            tdName.innerHTML = escapeHtml(name);
            tdKana.innerHTML = escapeHtml(kana);
          }
        });

        block.style.display = partyHasVisible ? '' : 'none';
        if(partyHasVisible) sectionHasVisible = true;
      });

      section.style.display = sectionHasVisible ? '' : 'none';
    });

    if(raw){
      hitCount.textContent = `${visibleCount}件`;
    } else {
      hitCount.textContent = '';
    }
    emptyState.style.display = (raw && visibleCount === 0) ? 'block' : 'none';
  }

  searchInput.addEventListener('input', runSearch);
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    runSearch();
    searchInput.focus();
  });

  runSearch();
})();
</script>
